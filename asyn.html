<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejemplo Fetch</title>
    <style>
        #galeria, #galeria2 {   
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding: 16px;
        }

        #galeria div, #galeria2 div {
            text-align: center;
        }

        #galeria img, #galeria2 img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
        }

        #galeria p, #galeria2 p {
            font-size: 14px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <h1>Usuarios</h1>
    <ul id="lista"></ul>
    
    <script>
        const lista = document.getElementById("lista");
        
        fetch("https://jsonplaceholder.typicode.com/users")
            .then(respuesta => respuesta.json())
            .then(usuarios => {
                usuarios.forEach(usuario => {
                    const li = document.createElement("li");
                    li.textContent = usuario.name;
                    lista.appendChild(li);
                });    
            })
            .catch(error => {
                console.error("Error al cargar datos:", error);
            });
    </script>   

    <h1>Galería de Fotos</h1>
    <div id="galeria"></div>
    
    <script>
        const galeria = document.getElementById("galeria");
        
        fetch("https://jsonplaceholder.typicode.com/photos?_limit=5")
            .then(respuesta => respuesta.json())
            .then(fotos => {
                fotos.forEach(foto => {
                    const div = document.createElement("div");
                    const img = document.createElement("img");
                    img.src = foto.thumbnailUrl;
                    img.alt = foto.title;
                    
                    const p = document.createElement("p");
                    p.textContent = foto.title;
                    
                    div.appendChild(img);
                    div.appendChild(p);
                    galeria.appendChild(div);
                });
            })
            .catch(error => {
                console.error("Error al cargar fotos:", error);
            });
    </script>

    <h3>Galería de Fotos (Picsum)</h3>
    <div id="galeria2"></div>
    
    <script>
        const galeria2 = document.getElementById("galeria2");
        
        fetch("https://jsonplaceholder.typicode.com/photos?_limit=5")
            .then(respuesta => respuesta.json())
            .then(fotos => {
                fotos.forEach(foto => {
                    const div = document.createElement("div");
                    const img = document.createElement("img");
                    img.src = `https://picsum.photos/id/${foto.id}/150/150`;
                    img.alt = foto.title;
                    
                    const p = document.createElement("p");
                    p.textContent = foto.title;
                    
                    div.appendChild(img);
                    div.appendChild(p);
                    galeria2.appendChild(div); // Corregido para que apunte correctamente a galeria2
                });
            })
            .catch(error => {
                console.error("Error al cargar fotos:", error);
            });
    </script>

</body>
</html>
