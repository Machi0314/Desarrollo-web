<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prácticas de DOM</title>
</head>
<body>

    <h1 id="titulo">Hola</h1>
    <button id="btnCambiar">Cambiar texto</button>

    <hr>

    <ul id="lista"></ul>
    <button id="btnAgregar">Agregar elemento</button>

    <hr>

    <button id="btnAlerta">Haz clic aquí</button>

    <hr>

    <form id="formulario">
        <input id="nombre" type="text" placeholder="Escribe tu nombre" />
        <button type="submit">Guardar</button>
    </form>

    <hr>
  
    <p>Última tecla presionada: <strong id="infoTecla">ninguna</strong></p>

    <script>
        
        const titulo = document.getElementById("titulo");
        const btnCambiar = document.getElementById("btnCambiar");
        
        btnCambiar.addEventListener("click", () => {
            titulo.textContent = "Texto cambiado con JavaScript";
            titulo.style.color = "blue";
            titulo.style.fontSize = "25px";
        });

        const lista = document.getElementById("lista");
        const btnAgregar = document.getElementById("btnAgregar");
        
        btnAgregar.addEventListener("click", () => {
            const li = document.createElement("li");
            li.textContent = "Hola amigos";
            lista.appendChild(li);
        });

        const btnAlerta = document.getElementById("btnAlerta");
        
        btnAlerta.addEventListener("click", () => {
            console.log("Se hizo clic");
            alert("¡Botón presionado!");
        });

        const formulario = document.getElementById("formulario");
        
        formulario.addEventListener("submit", (evento) => {
            evento.preventDefault();
            const nombreInput = document.getElementById("nombre").value;
            
            alert("Dato guardado!");
            console.log("Nombre:", nombreInput);
        });

        const infoTecla = document.getElementById("infoTecla");

        document.addEventListener("keydown", (evento) => {
            console.log("Tecla presionada:", evento.key);
            
            infoTecla.textContent = evento.key;
        });
    </script>

</body>
</html>
